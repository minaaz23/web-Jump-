<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Jump! Prototipe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: web app dengan sidebar di desktop dan tab bar bawah di HP. Warna cerah, pink sebagai aksen utama. */
:root {
  --bg: #FFF3F8;
  --surface: #FFFFFF;
  --surface2: #FFE6F1;
  --ink: #2B1038;
  --muted: #7B5E8A;
  --line: #F5D2E4;
  --pink: #F22B7C;
  --pink2: #FF6FA8;
  --coral: #FF7A4D;
  --violet: #7B4DFF;
  --violet-bg: #EEE8FF;
  --yellow: #FFC928;
  --mint: #12B886;
  --mint-bg: #D8F7EA;
  --mint-ink: #0A7455;
  --warn-ink: #B3400A;
  --warn-bg: #FFE4D2;
  --on-accent: #FFFFFF;
  --shadow: 0 14px 34px -16px rgba(242,43,124,.38);
  --shadow-s: 0 4px 14px -8px rgba(122,40,110,.30);
  --grad: linear-gradient(135deg, #F22B7C 0%, #FF5C8F 45%, #FF8A4D 100%);
  --grad-soft: linear-gradient(135deg, #FFE0EE, #FFEBDD);
  --font-head: 'Sora', 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #170A21; --surface: #241233; --surface2: #33194A; --ink: #FFEFF7; --muted: #C9A9D8; --line: #44235C;
    --pink: #FF5C9A; --pink2: #FF8DB9; --coral: #FF8F66; --violet: #A58BFF; --violet-bg: #2D2058; --yellow: #FFD45C;
    --mint: #3DDDAE; --mint-bg: #10382F; --mint-ink: #5CE8BE; --warn-ink: #FFA877; --warn-bg: #432312;
    --on-accent: #2B0A1C; --shadow: 0 14px 34px -16px rgba(0,0,0,.7); --shadow-s: 0 4px 14px -8px rgba(0,0,0,.6);
    --grad: linear-gradient(135deg, #FF5C9A 0%, #FF7C8F 50%, #FF9A62 100%); --grad-soft: linear-gradient(135deg, #3B1B4F, #46223A);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #170A21; --surface: #241233; --surface2: #33194A; --ink: #FFEFF7; --muted: #C9A9D8; --line: #44235C;
  --pink: #FF5C9A; --pink2: #FF8DB9; --coral: #FF8F66; --violet: #A58BFF; --violet-bg: #2D2058; --yellow: #FFD45C;
  --mint: #3DDDAE; --mint-bg: #10382F; --mint-ink: #5CE8BE; --warn-ink: #FFA877; --warn-bg: #432312;
  --on-accent: #2B0A1C; --shadow: 0 14px 34px -16px rgba(0,0,0,.7); --shadow-s: 0 4px 14px -8px rgba(0,0,0,.6);
  --grad: linear-gradient(135deg, #FF5C9A 0%, #FF7C8F 50%, #FF9A62 100%); --grad-soft: linear-gradient(135deg, #3B1B4F, #46223A);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--font-head); margin: 0; line-height: 1.15; letter-spacing: -.01em; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; border-radius: 10px; }
svg { display: block; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 1fr; min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 96px; max-width: 1360px; margin: 0 auto; }
.side { display: none; }
.main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.top { display: flex; align-items: center; gap: 12px; }
.top .brand { display: flex; align-items: center; gap: 10px; }
.top .ttl { flex: 1; min-width: 0; }
.top .ttl h1 { font-size: 22px; font-weight: 800; }
.top .ttl p { color: var(--muted); font-size: 13px; }
.logo { width: 40px; height: 40px; border-radius: 14px; background: var(--grad); display: grid; place-items: center; box-shadow: var(--shadow); flex: none; }
.logo svg { width: 26px; height: 26px; }
.wordmark { font-family: var(--font-head); font-weight: 800; font-size: 22px; letter-spacing: -.03em; }
.wordmark b { color: var(--pink); }
.iconbtn { width: 42px; height: 42px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink); flex: none; }
.iconbtn:hover { background: var(--surface2); }
.who { display: none; align-items: center; gap: 10px; padding: 4px 14px 4px 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.who .av { width: 34px; height: 34px; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); box-shadow: 0 -10px 30px -18px rgba(122,40,110,.4); }
.tabbar a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 600; border-radius: 14px; }
.tabbar a[aria-current="page"] { color: var(--pink); }
.tabbar a[aria-current="page"] svg { stroke-width: 2.4; }
.tabbar .fab { margin-top: -26px; }
.tabbar .fab span.c { width: 56px; height: 56px; border-radius: 50%; background: var(--grad); color: var(--on-accent); display: grid; place-items: center; box-shadow: var(--shadow); border: 4px solid var(--surface); }
.tabbar .fab { color: var(--pink); }

@media (min-width: 960px) {
  .shell { grid-template-columns: 252px minmax(0, 1fr); column-gap: 28px; padding-bottom: 40px; padding-top: 20px; }
  .side { display: flex; flex-direction: column; gap: 6px; position: sticky; top: 20px; align-self: start; height: calc(100dvh - 40px); max-height: 860px; background: var(--surface); border: 1px solid var(--line); border-radius: 28px; padding: 20px 14px 14px; box-shadow: var(--shadow-s); }
  .side .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 16px; }
  .side nav { display: flex; flex-direction: column; gap: 4px; }
  .side nav a { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; color: var(--muted); text-decoration: none; font-weight: 600; }
  .side nav a:hover { background: var(--surface2); color: var(--ink); }
  .side nav a[aria-current="page"] { background: var(--grad); color: var(--on-accent); box-shadow: var(--shadow); }
  .side .grow { flex: 1; }
  .promo { background: var(--grad-soft); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .promo h4 { font-size: 15px; }
  .promo p { font-size: 12.5px; color: var(--muted); }
  .side .foot { font-size: 11.5px; color: var(--muted); padding: 8px 10px 0; }
  .tabbar { display: none; }
  .top .brand { display: none; }
  .who { display: flex; }
  .top .ttl h1 { font-size: 30px; }
  .top .ttl p { font-size: 14px; }
  .top .mob { display: none; }
}

/* ---------- komponen ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 20px; box-shadow: var(--shadow-s); min-width: 0; }
.card.flat { box-shadow: none; }
.card h2 { font-size: 18px; font-weight: 700; }
.card .hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card .hd p { color: var(--muted); font-size: 13px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: 1fr; }
.g3 { grid-template-columns: 1fr; }
.g4 { grid-template-columns: 1fr 1fr; }
@media (min-width: 760px) { .g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1100px) { .g4 { grid-template-columns: repeat(4, 1fr); } .g21 { grid-template-columns: 1.6fr 1fr; } }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sp { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--pink); }

.row .btn.sp { flex: 1 1 140px; }
.btn { white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; padding: 11px 18px; font-weight: 700; font-size: 15px; text-decoration: none; transition: transform .12s, box-shadow .12s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--grad); color: var(--on-accent); box-shadow: var(--shadow); }
.btn.primary:hover { box-shadow: 0 18px 34px -14px rgba(242,43,124,.6); }
.btn.soft { background: var(--surface2); color: var(--ink); }
.btn.soft:hover { background: var(--line); }
.btn.line { background: transparent; border: 2px solid var(--ink); color: var(--ink); padding: 9px 18px; }
.btn.white { background: #fff; color: #C21462; }
.btn.glass { background: rgba(255,255,255,.22); color: #fff; }
.btn.lg { padding: 14px 26px; font-size: 16px; }
.btn.sm { padding: 7px 14px; font-size: 13px; }
.btn.danger { background: var(--warn-bg); color: var(--warn-ink); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.tag { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.tag.ok { background: var(--mint-bg); color: var(--mint-ink); }
.tag.warn { background: var(--warn-bg); color: var(--warn-ink); }
.tag.ex { background: var(--surface2); color: var(--muted); }
.tag.vio { background: var(--violet-bg); color: var(--violet); }
.tag.pink { background: var(--pink); color: var(--on-accent); }

.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-head); font-weight: 700; font-size: 14px; color: #fff; flex: none; }
.chip { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
.chip[aria-pressed="true"] { border-color: var(--pink); background: var(--surface2); color: var(--ink); }
.chip .av { width: 26px; height: 26px; font-size: 11px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 14px; }
input[type=text], select, input[type=search] { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 14px; min-height: 44px; width: 100%; }
input[type=range] { width: 100%; accent-color: var(--pink); min-height: 28px; }

/* hero */
.hero { position: relative; overflow: hidden; border-radius: 32px; padding: 26px 22px; background: var(--grad); color: #fff; display: grid; gap: 18px; box-shadow: var(--shadow); }
.hero h1 { font-size: 28px; font-weight: 800; max-width: 17ch; }
.hero p { max-width: 46ch; opacity: .95; }
.hero .art { position: absolute; right: -10px; top: -6px; width: 260px; opacity: .9; pointer-events: none; }
.hero .glass { background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.35); border-radius: 22px; padding: 14px 18px; backdrop-filter: blur(6px); display: inline-flex; flex-direction: column; gap: 2px; width: fit-content; }
.hero .glass b { font-family: var(--font-head); font-size: 34px; line-height: 1; }
.hero .eyebrow { color: #fff; opacity: .9; }
@media (min-width: 760px) { .hero { padding: 36px 40px; } .hero h1 { font-size: 40px; } .hero .art { width: 420px; right: 10px; top: 0; } }

.stat { display: flex; gap: 12px; align-items: center; padding: 16px; }
.stat .ico { width: 46px; height: 46px; border-radius: 16px; display: grid; place-items: center; flex: none; }
.stat b { display: block; font-family: var(--font-head); font-size: 24px; line-height: 1.1; }
.stat span { font-size: 12.5px; color: var(--muted); }
.i-pink { background: var(--surface2); color: var(--pink); }
.i-vio { background: var(--violet-bg); color: var(--violet); }
.i-mint { background: var(--mint-bg); color: var(--mint-ink); }
.i-warn { background: var(--warn-bg); color: var(--warn-ink); }

.rank { display: flex; flex-direction: column; gap: 10px; }
.rank .r { display: grid; grid-template-columns: 30px 40px 1fr auto; gap: 12px; align-items: center; }
.rank .medal { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; background: var(--surface2); color: var(--muted); }
.rank .m1 { background: #FFD54A; color: #5A3C00; } .rank .m2 { background: #D9DEE8; color: #3B4256; } .rank .m3 { background: #F4B07F; color: #5C2A06; }
.rank .bar { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; margin-top: 5px; }
.rank .bar i { display: block; height: 100%; border-radius: 99px; background: var(--grad); }
.rank b.v { font-family: var(--font-head); font-size: 17px; }

.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li .meta { font-size: 12.5px; color: var(--muted); }
.li .val { text-align: right; font-weight: 700; }
.li .val small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }

.tip { background: var(--grad-soft); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.tip h3 { font-size: 17px; }

/* atlet */
.acard { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-s); transition: transform .15s, box-shadow .15s; }
.acard:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.acard .big { font-family: var(--font-head); font-size: 28px; font-weight: 800; line-height: 1; }
.acard .big small { font-size: 14px; font-weight: 600; color: var(--muted); }
.addcard { border: 2px dashed var(--pink2); background: transparent; color: var(--pink); border-radius: 24px; min-height: 180px; display: grid; place-items: center; align-content: center; gap: 8px; font-weight: 700; box-shadow: none; }

/* modal */
#modal { position: fixed; inset: 0; z-index: 50; display: none; align-items: flex-end; justify-content: center; background: rgba(35,8,45,.55); padding: 0; }
#modal.on { display: flex; }
.sheet { background: var(--bg); width: 100%; max-width: 720px; max-height: 92dvh; overflow: auto; border-radius: 28px 28px 0 0; padding: 20px max(16px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
@media (min-width: 760px) { #modal { align-items: center; padding: 24px; } .sheet { border-radius: 28px; padding: 26px; } }
.sheet .close { margin-left: auto; }

/* stepper */
.stepper { display: flex; gap: 8px; align-items: center; }
.stepper .s { flex: 1; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: 13.5px; color: var(--muted); min-width: 0; }
.stepper .s i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; background: var(--surface2); display: grid; place-items: center; font-size: 13px; flex: none; }
.stepper .s.on { border-color: var(--pink); color: var(--ink); background: var(--surface2); }
.stepper .s.on i { background: var(--grad); color: var(--on-accent); }
.stepper .s.done i { background: var(--mint); color: #fff; }
.stepper .s span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 520px) { .stepper .s span { display: none; } .stepper .s.on span { display: inline; } .stepper .s { flex: none; } .stepper .s.on { flex: 1; } }

.opt2 { grid-template-columns: 1fr; }
@media (min-width: 520px) { .opt2 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 959px) { .top .ttl p { display: none; } }
.opt { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 20px; padding: 14px; display: flex; gap: 12px; align-items: center; }
.opt[aria-pressed="true"] { border-color: var(--pink); background: var(--surface2); }
.opt .ico { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: var(--surface2); color: var(--pink); flex: none; }
.opt[aria-pressed="true"] .ico { background: var(--grad); color: var(--on-accent); }
.opt b { display: block; }
.opt span.s { font-size: 12.5px; color: var(--muted); }
.drop { border: 2px dashed var(--pink2); border-radius: 22px; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; cursor: pointer; background: var(--surface); }
.drop:hover, .drop.over { background: var(--surface2); }
.drop .ico { width: 52px; height: 52px; border-radius: 18px; background: var(--grad); color: var(--on-accent); display: grid; place-items: center; }
.drop video { width: 100%; max-height: 180px; border-radius: 14px; background: #000; }
.vis { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.switch { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: var(--surface2); }
.switch button { width: 46px; height: 28px; border-radius: 99px; border: 0; background: var(--line); position: relative; flex: none; }
.switch button::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch button[aria-pressed="true"] { background: var(--pink); }
.switch button[aria-pressed="true"]::after { transform: translateX(18px); }

.progress { height: 12px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--grad); border-radius: 99px; transition: width .4s; }
.analyzing { display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 22px; background: var(--grad-soft); }

/* stage */
.stage { position: relative; border-radius: 24px; overflow: hidden; background: #2A0F3D; }
.stage svg, .stage video { width: 100%; height: auto; display: block; }
.stage video { max-height: 340px; background: #000; }
.stage .badge { position: absolute; left: 12px; top: 12px; background: rgba(0,0,0,.45); color: #fff; border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700; }
.stage .phase { position: absolute; right: 12px; bottom: 12px; background: var(--pink); color: #fff; border-radius: 999px; padding: 4px 12px; font-size: 12.5px; font-weight: 700; }
.chk { display: grid; grid-template-columns: 38px 1fr auto; gap: 12px; align-items: center; padding: 12px; border-radius: 18px; background: var(--surface2); }
.chk .ci { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; }
.chk.ok .ci { background: var(--mint-bg); color: var(--mint-ink); }
.chk.bad { background: var(--warn-bg); }
.chk.bad .ci { background: var(--warn-ink); color: #fff; }
.chk b { display: block; font-size: 14.5px; }
.chk .s { font-size: 12.5px; color: var(--muted); }
.chk.bad .s { color: var(--warn-ink); }
@media (max-width: 560px) { .chk { grid-template-columns: 38px 1fr; } .chk > span.small { grid-column: 2; } }
.banner { border-radius: 18px; padding: 12px 16px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.banner.ok { background: var(--mint-bg); color: var(--mint-ink); }
.banner.bad { background: var(--warn-bg); color: var(--warn-ink); }
.marker { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; }
.nudge { display: inline-flex; align-items: center; gap: 6px; }
.nudge button { width: 34px; height: 34px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 800; }
.nudge output { min-width: 52px; text-align: center; font-weight: 800; font-family: var(--font-head); }
.live { background: var(--grad); color: #fff; border-radius: 20px; padding: 14px 18px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.live b { font-family: var(--font-head); font-size: 30px; line-height: 1; }

/* hasil */
.res { position: relative; overflow: hidden; border-radius: 32px; background: var(--grad); color: #fff; padding: 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }

      case 'reset-th': T().minFps = DEF.minFps; T().maxTilt = DEF.maxTilt; T().maxKnee = DEF.maxKnee; save(); render(false); break;
      case 'reset-demo': if (S.confirm === 'reset') { var th = T(); DB = seed(); DB.settings = th; save(); S.athId = DB.athletes[0].id; S.confirm = ''; toast('Data contoh dipulihkan'); } else S.confirm = 'reset'; render(false); break;
      case 'wipe': if (S.confirm === 'wipe') { DB.athletes = []; DB.tests = []; S.athId = null; S.confirm = ''; save(); toast('Semua data dihapus'); } else S.confirm = 'wipe'; render(false); break;
    }
  });
  document.addEventListener('input', function (e) {
    var el = e.target, k = el.dataset && el.dataset.in;
    if (k === 'n1' || k === 'n2') { setMark(k, +el.value); var pv = $('#pv'); if (pv && pv.duration) { try { pv.currentTime = +el.value / S.fps; } catch (x) {} } }
    else if (k === 'calcH') { S.calcH = +el.value; $('#calcBox').innerHTML = calcBox(); var r = $('#calcH'); if (r) r.focus(); }
    else if (k && k.indexOf('th-') === 0) { var key = k.slice(3); T()[key] = +el.value; save(); $('#v-' + key).textContent = el.value + (key === 'minFps' ? ' fps' : '°'); }
    else if (el.id === 'aq') { S.aq = el.value; var pos = el.selectionStart; render(false); var q = $('#aq'); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (x) {} } }
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'vid' && el.files && el.files[0]) {
      var f = el.files[0]; if (S.file) { try { URL.revokeObjectURL(S.file); } catch (x) {} }
      S.file = URL.createObjectURL(f); S.fileName = f.name; toast('Video dipilih'); render(false);
    } else if (el.id === 'hAth') { S.hAth = el.value; render(false); }
    else if (el.id === 'massTeam') { S.massTeam = el.value; }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'addform') return; e.preventDefault();
    var n = $('#an-name').value.trim(); if (!n) return;
    var a = { id: 'a' + Date.now(), name: n, team: $('#an-team').value.trim() || 'Tanpa tim', sport: $('#an-sport').value.trim() || 'Umum', c: DB.athletes.length % COLORS.length };
    DB.athletes.push(a); S.athId = a.id; save(); closeModal(); toast(n + ' ditambahkan'); render(false);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
  ['dragover', 'dragleave', 'drop'].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      var d = e.target.closest && e.target.closest('#drop'); if (!d) return; e.preventDefault();
      if (ev === 'dragover') d.classList.add('over'); else d.classList.remove('over');
      if (ev === 'drop' && e.dataTransfer.files[0]) { var f = e.dataTransfer.files[0]; if (/^video\//.test(f.type)) { if (S.file) { try { URL.revokeObjectURL(S.file); } catch (x) {} } S.file = URL.createObjectURL(f); S.fileName = f.name; render(false); } else toast('Pilih file video'); }
    });
  });
  window.addEventListener('hashchange', route);
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeIcon); } catch (e) {}
  buildNav(); applyTheme(); route();
  window.__jump = { S: S, go: go, DB: function () { return DB; } };
})();
</script>
